<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Curve · Quamolit 原有动画</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="scene" aria-label="32 段控制点的动态闭合曲线"></canvas>
  <nav aria-label="演示导航"><a href="../../demos/index.html?group=originals">← 所有演示</a></nav>
  <button id="panel-toggle" aria-controls="panel" aria-expanded="true">收起面板</button>
  <aside id="panel" aria-label="动画控制">
    <span class="eyebrow">QUAMOLIT / ORIGINAL 03</span>
    <h1>Curve<br><small>一条会生长的闭合曲线</small></h1>
    <p>原来的 32 段控制点闭合曲线。逻辑时间由页面显式注入，旋转与顶点全部由 Calcit 纯函数决定。</p>
    <div class="buttons"><button id="play">播放</button><button id="reset">回到起点</button><button id="share">复制当前时间链接</button></div>
    <label>时间（秒） <input id="time" type="range" min="0" max="120" step="0.01" value="0"></label>
    <div class="buttons"><button data-time="0">0 s</button><button data-time="30">30 s</button><button data-time="60">60 s</button><button data-time="120">120 s</button></div>
    <output id="status" aria-live="off"></output>
    <p class="note">Canvas2D · 单条折线，绝对时间采样，同一时间可乱序/重复截图。每次采样重建顶点，尚未做几何保留或 GPU 合批。</p>
    <a href="https://github.com/Quamolit/quamolit/blob/main/docs/curve-restoration.md">行为依据与检验规则</a>
  </aside>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
