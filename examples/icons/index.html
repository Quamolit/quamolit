<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Icons · Quamolit 原有动画</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="scene" aria-label="加号计数与播放暂停路径变形"></canvas>
  <nav aria-label="演示导航"><a href="../../demos/index.html?group=originals">← 所有演示</a></nav>
  <button id="panel-toggle" aria-controls="panel" aria-expanded="true">收起面板</button>
  <aside id="panel" aria-label="动画控制">
    <span class="eyebrow">QUAMOLIT / ORIGINAL 05</span>
    <h1>Icons<br><small>两个可打断的图标动画</small></h1>
    <p>点击按钮试试连续操作：左侧加号每次旋转 90° 并切换数字；右侧播放/暂停由两条路径共同变形。</p>
    <div class="buttons"><button id="increase">加一 · 旋转</button><button id="toggle-icon">切换播放图标</button></div>
    <div class="buttons"><button id="play-time">播放时间</button><button id="reset">重置</button><button id="share">复制当前时间链接</button></div>
    <label>时间（秒） <input id="time" type="range" min="0" max="120" step="0.01" value="0"></label>
    <div class="buttons"><button data-time="0">0 s</button><button data-time="0.1">0.1 s</button><button data-time="0.3">0.3 s</button><button data-time="1">1 s</button></div>
    <output id="status" aria-live="off"></output>
    <p class="note">事件只改变 Calcit Model 的目标；中间帧由显式时间采样。Canvas 路径当前以描边折线呈现，原有实心填充和舞台直接命中待补。</p>
    <a href="https://github.com/Quamolit/quamolit/blob/main/docs/icons-restoration.md">行为依据与检验规则</a>
  </aside>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
