<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Icons · Quamolit 原有动画</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="加号计数与播放暂停路径变形"></canvas>
    <nav aria-label="演示导航"><a href="../../demos/index.html?group=originals">← 所有演示</a></nav>
    <button id="panel-toggle" aria-controls="panel" aria-expanded="true">收起面板</button>
    <aside id="panel" aria-label="动画控制">
      <span class="eyebrow">QUAMOLIT / ORIGINAL 05</span>
      <h1>Icons<br /><small>两个可打断的图标动画</small></h1>
      <p>
        直接点击画布里的卡片或下方按钮：左侧加号每次旋转
        90°，当前数字向下退出、下一数字从上方进入；右侧播放/暂停由两条路径共同变形。
      </p>
      <div class="buttons">
        <button id="increase">加一 · 旋转</button><button id="toggle-icon">切换播放图标</button>
      </div>
      <div class="buttons">
        <button id="play-time">播放时间</button><button id="reset">重置</button
        ><button id="share">复制当前时间链接</button>
      </div>
      <label>时间（秒） <input id="time" type="range" min="0" max="120" step="0.01" value="0" /></label>
      <div class="buttons">
        <button data-time="0">0 s</button><button data-time="0.1">0.1 s</button><button data-time="0.3">0.3 s</button
        ><button data-time="1">1 s</button>
      </div>
      <output id="status" aria-live="off"></output>
      <p class="note">
        事件只改变 Calcit Model 的目标；中间帧与卡片命中均由 Calcit
        定义。恢复历史线性时长、数字重叠方向和画布直接点击；DOM 只保留辅助控制。
      </p>
      <a href="https://github.com/Quamolit/quamolit/blob/main/docs/icons-restoration.md">行为依据与检验规则</a>
    </aside>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
