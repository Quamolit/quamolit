<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binary Tree · Quamolit 原有动画</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="scene" aria-label="随时间摆动的递归二叉树"></canvas>
  <nav aria-label="演示导航"><a href="../../demos/index.html?group=originals">← 所有演示</a></nav>
  <button id="panel-toggle" aria-controls="panel" aria-expanded="true">收起面板</button>
  <aside id="panel" aria-label="动画控制">
    <span class="eyebrow">QUAMOLIT / ORIGINAL 01</span>
    <h1>Binary Tree<br><small>一棵随时间呼吸的树</small></h1>
    <p>原来的 5 层递归与两种摆动节奏。分支几何由 Calcit 纯函数生成，画布覆盖整个页面。</p>
    <div class="buttons"><button id="play">播放</button><button id="reset">回到起点</button><button id="share">复制当前时间链接</button></div>
    <label>时间（秒） <input id="time" type="range" min="0" max="60" step="0.01" value="0"></label>
    <div class="buttons"><button data-time="0">0 s</button><button data-time="2.5">2.5 s</button><button data-time="5">5 s</button><button data-time="10">10 s</button></div>
    <output id="status" aria-live="off"></output>
    <p class="note">Canvas2D · CPU 全量参考。递归运动与三点路径的圆头、圆连接已恢复。每帧 63 次原生描边；Scene IR 缓存与 WebGPU 尚待后续，不代表性能验收。</p>
    <a href="https://github.com/Quamolit/quamolit/blob/main/docs/binary-tree-restoration.md">行为依据与检验规则</a>
  </aside>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
