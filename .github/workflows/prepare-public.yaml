name: Temporary public-method preparation
on:
  push:
    branches: [prepare/public-methods-031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve unchanged formal dependencies
        run: |
          set -euo pipefail
          yarn install --immutable
          caps --strict --ci
          caps verify --toolchain
      - name: Apply reviewed length transaction
        run: node apply-length.mjs
      - name: Check canonical Snapshot and original attached tests
        run: |
          set -euo pipefail
          prepared_blob=$(git hash-object calcit.cirru)
          calcit calcit.cirru edit format
          test "$prepared_blob" = "$(git hash-object calcit.cirru)"
          calcit calcit.cirru test --require-match --summary-only --format json
          yarn check:api-inventory
      - name: Retain reviewed preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-method-preparation
          path: |
            acceptance/
            calcit.cirru
          if-no-files-found: error
          retention-days: 7
