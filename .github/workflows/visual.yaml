name: Visual regression

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      mutation:
        description: "仅供验证失败 artifact：在 UI 中间帧注入颜色错误"
        required: false
        default: none
        type: choice
        options:
          - none
          - color

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - uses: calcit-lang/setup-calcit@v1
        with:
          tools: calcit,caps

      - run: yarn install --immutable

      - name: Install pinned Chromium and system dependencies
        run: yarn playwright install --with-deps chromium

      - name: Run fixed-time browser comparisons
        run: yarn test:visual
        env:
          CI: "true"
          QUAMOLIT_VISUAL_MUTATION: ${{ inputs.mutation == 'color' && 'color' || '' }}

      - name: Check Motion scalar sampling in Chromium
        if: inputs.mutation != 'color'
        run: yarn test:motion-browser
        env:
          CI: "true"

      - name: Check typed Motion GPU lowering contract
        if: inputs.mutation != 'color'
        run: yarn test:motion-gpu
        env:
          CI: "true"

      - name: Check fixed-step simulation and replay
        if: inputs.mutation != 'color'
        run: yarn test:simulation
        env:
          CI: "true"

      - name: Check direct-frame sampling and dependency revisions
        if: inputs.mutation != 'color'
        run: yarn test:direct
        env:
          CI: "true"

      - name: Check host-clock mapping and playback controls
        if: inputs.mutation != 'color'
        run: yarn test:host-clock
        env:
          CI: "true"

      - name: Check integrated playback time boundary
        if: inputs.mutation != 'color'
        run: yarn test:playback
        env:
          CI: "true"

      - name: Check declarative component sampling
        if: inputs.mutation != 'color'
        run: yarn test:component-sample
        env:
          CI: "true"

      - name: Check legacy fade migration
        if: inputs.mutation != 'color'
        run: yarn test:fade-migration
        env:
          CI: "true"

      - name: Check typed Scene IR core and serialization
        if: inputs.mutation != 'color'
        run: yarn test:scene-core
        env:
          CI: "true"

      - name: Check versioned instance data boundary
        if: inputs.mutation != 'color'
        run: yarn test:instance-sources
        env:
          CI: "true"

      - name: Check batched Canvas instance boundary
        if: inputs.mutation != 'color'
        run: yarn test:canvas-batches
        env:
          CI: "true"

      - name: Check public Canvas instances draw boundary
        if: inputs.mutation != 'color'
        run: yarn test:canvas-instances-reference
        env:
          CI: "true"

      - name: Check versioned instance resource table
        if: inputs.mutation != 'color'
        run: yarn test:instance-resource
        env:
          CI: "true"

      - name: Check versioned instance GPU upload
        if: inputs.mutation != 'color'
        run: yarn test:instance-gpu
        env:
          CI: "true"

      - name: Check WebGPU instance contract and explicit fallback
        if: inputs.mutation != 'color'
        run: yarn test:webgpu-instances
        env:
          CI: "true"

      - name: Check logical Scene diff and dirty classifications
        if: inputs.mutation != 'color'
        run: yarn test:scene-diff
        env:
          CI: "true"

      - name: Check typed Scene motion binding resolution
        if: inputs.mutation != 'color'
        run: yarn test:scene-binding
        env:
          CI: "true"

      - name: Check Calcit retained component integration
        if: inputs.mutation != 'color'
        run: yarn test:retained-component
        env:
          CI: "true"

      - name: Check public component GPU batch and explicit fallback
        if: inputs.mutation != 'color'
        run: yarn test:gpu-component
        env:
          CI: "true"

      - name: Check isolated Calcit consumer installation and relocated output
        if: inputs.mutation != 'color'
        run: yarn test:consumer
        env:
          CI: "true"
          QUAMOLIT_CONSUMER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          QUAMOLIT_CONSUMER_BENCH: "1"
          QUAMOLIT_BENCH_WARMUP: "0.2"
          QUAMOLIT_BENCH_DURATION: "0.6"
          QUAMOLIT_BENCH_RUNS: "1"

      - name: Upload public GPU component evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-gpu-component-${{ github.run_id }}
          path: test-results/gpu-component/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload isolated consumer evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-consumer-${{ github.run_id }}
          path: test-results/consumer/
          if-no-files-found: error
          retention-days: 14

      - name: Check demo catalog and published navigation
        if: inputs.mutation != 'color'
        run: yarn test:demo-nav
        env:
          CI: "true"

      - name: Check restored binary tree Calcit geometry
        if: inputs.mutation != 'color'
        run: yarn test:binary-tree

      - name: Check restored Curve Calcit geometry
        if: inputs.mutation != 'color'
        run: yarn test:curve-demo
        env:
          CI: "true"

      - name: Upload Curve fixed-time evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-curve-${{ github.run_id }}
          path: test-results/curve/
          if-no-files-found: error
          retention-days: 14

      - name: Check restored Solar recursive orbits
        if: inputs.mutation != 'color'
        run: yarn test:solar-demo
        env:
          CI: "true"

      - name: Upload Solar fixed-time evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-solar-${{ github.run_id }}
          path: test-results/solar/
          if-no-files-found: error
          retention-days: 14

      - name: Check restored Icons interruptions and paths
        if: inputs.mutation != 'color'
        run: yarn test:icons-demo
        env:
          CI: "true"

      - name: Upload Icons fixed-time evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-icons-${{ github.run_id }}
          path: test-results/icons/
          if-no-files-found: error
          retention-days: 14

      - name: Check restored Raining fixed-seed frames
        if: inputs.mutation != 'color'
        run: yarn test:raining-demo
        env:
          CI: "true"

      - name: Upload Raining fixed-tick evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-raining-${{ github.run_id }}
          path: test-results/raining/
          if-no-files-found: error
          retention-days: 14

      - name: Check restored TodoList lifecycle and Canvas interaction
        if: inputs.mutation != 'color'
        run: yarn test:todolist
        env:
          CI: "true"

      - name: Check restored Clock digits and carries
        if: inputs.mutation != 'color'
        run: yarn test:clock-demo
        env:
          CI: "true"

      - name: Upload Clock fixed-time evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-clock-${{ github.run_id }}
          path: test-results/clock/
          if-no-files-found: error
          retention-days: 14

      - name: Upload TodoList fixed-time and interaction evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-todolist-${{ github.run_id }}
          path: test-results/todolist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload demo site and navigation evidence
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-demos-${{ github.run_id }}
          path: |
            demos/catalog.json
            dist-demos/
            test-results/demo-nav/
          if-no-files-found: error
          retention-days: 14

      - name: Upload retained component demonstration
        if: always() && inputs.mutation != 'color'
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-retained-component-${{ github.run_id }}
          path: test-results/retained-component/
          if-no-files-found: warn
          retention-days: 14

      - name: Check interruption continuity and event replay
        if: inputs.mutation != 'color'
        run: yarn test:transition
        env:
          CI: "true"

      - name: Check keyed presence lifecycle and release notices
        if: inputs.mutation != 'color'
        run: yarn test:presence
        env:
          CI: "true"

      - name: Check retained presence instance resources
        if: inputs.mutation != 'color'
        run: yarn test:presence-resources
        env:
          CI: "true"

      - name: Upload actual, expected, diff and input manifest on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quamolit-visual-failure-${{ github.run_id }}
          path: |
            test-results/visual/
            test-results/motion/
            playwright-report/
            playwright-report-motion/
          if-no-files-found: error
          retention-days: 14
