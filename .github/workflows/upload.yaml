name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - run: corepack enable

    - uses: calcit-lang/setup-calcit@v1
      with:
        tools: calcit,caps

    - name: "compiles to js"
      run: >
        yarn install --immutable
        && yarn compile && yarn release
        && yarn test:clock && yarn test:runtime && yarn test:fixtures && yarn compile:visual
        && cp -vr assets dist/

    - name: Check API namespace inventory and alpha signatures
      run: yarn check:api-inventory

    - name: Publish PR preview
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: Pendect/action-rsyncer@b7f90f4f8ed893d4e3f852f7a73180631f63d4bd # v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: '-avzr --progress'
        options: '--rsync-path="mkdir -p /web-assets/repo/${{ github.repository }}/pr/${{ github.event.number }} && rsync"'
        ssh_options: ''
        src: 'dist/'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/pr/${{ github.event.number }}/'

    - name: PR preview link
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        PREVIEW_URL: https://repo.tiye.me/${{ github.repository }}/pr/${{ github.event.number }}/
      run: |
        printf '### PR 预览\n\n[%s](%s)\n\n提交：`%s`。仅测试成功后上传 dist；不覆盖主站。\n' "$PREVIEW_URL" "$PREVIEW_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

    - name: Deploy to server
      if: github.event_name == 'workflow_dispatch'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"
