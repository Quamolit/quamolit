<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Quamolit 退出资源验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { border: 1px solid #94a3b8; display: block; margin: 16px 0; }
      canvas[hidden] { display: none; }
      button { margin-right: 8px; margin-bottom: 8px; padding: 6px 10px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <nav aria-label="演示导航" style="position:fixed;top:10px;right:12px;z-index:1000;background:#fff;border:1px solid #b8cbd5;border-radius:7px;padding:6px 12px;font:14px system-ui"><a href="../demos/index.html" style="color:#175b73">← 所有演示</a></nav>
    <h1>退出动画与实例资源生命周期</h1>
    <p>固定事件日志独立重放；同一 Presence 中间帧由 Canvas 参考与可用时的 WebGPU 实例图层对照。</p>
    <p><output id="backend">WebGPU 能力探测中…</output></p>
    <div id="times"></div>
    <button id="disable-gpu">禁用 GPU</button><button id="retry-gpu">重试 GPU</button>
    <canvas id="scene" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <canvas id="gpu-scene" width="320" height="100" hidden></canvas>
    <script type="module" src="./presence-resources.mjs"></script>
  </body>
</html>
