<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quamolit CPU 自定义采样验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { display: block; border: 1px solid #94a3b8; margin: 16px 0; }
      button { margin: 0 8px 8px 0; padding: 6px 10px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>CPU 自定义标量采样</h1>
    <p>描述符只保存回调 ID；函数存放在运行时注册表。GPU 状态明确为不支持，不会自动生成 WGSL。本页 Canvas 仅用于验证中间帧。</p>
    <div id="controls"></div>
    <canvas id="custom" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <script type="module" src="./custom.mjs"></script>
  </body>
</html>
