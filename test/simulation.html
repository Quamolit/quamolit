<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quamolit 固定步长模拟验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { display: block; border: 1px solid #94a3b8; margin: 16px 0; }
      button { margin: 0 8px 8px 0; padding: 6px 10px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>固定步长模拟重放</h1>
    <p>每 tick 固定 0.25 秒，输入记录与 seed 显式保存。任意显示帧请求顺序都从起点或检查点重放；Canvas 仅负责检验画面，不推进模拟。</p>
    <div id="controls"></div>
    <canvas id="simulation" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <script type="module" src="./simulation.mjs"></script>
  </body>
</html>
