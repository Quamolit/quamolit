<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quamolit 颜色渐变采样验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { display: block; border: 1px solid #94a3b8; margin: 16px 0; }
      button { margin: 0 8px 8px 0; padding: 6px 10px; }
      input { width: 280px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>线性 sRGB 颜色渐变</h1>
    <p>透明红色渐变到不透明蓝色。颜色通道在线性光空间插值，alpha 单独线性插值；绘制时才交给 Canvas 合成到白底。</p>
    <div id="controls"></div>
    <label>时间 <input id="time" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
    <canvas id="color" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <script type="module" src="./color.mjs"></script>
  </body>
</html>
