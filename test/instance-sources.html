<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Quamolit 实例数据版本验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { border: 1px solid #94a3b8; display: block; margin: 16px 0; }
      canvas[hidden] { display: none; }
      button { margin-right: 8px; padding: 6px 10px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>单逻辑节点、万实例数据</h1>
    <p>同一 Scene IR 与实例源分别进入 Canvas 参考和 WebGPU 图层；GPU 不可用时显示完整图层回退。</p>
    <button id="v1">版本 1</button><button id="v2">版本 2</button>
    <button id="disable-gpu">禁用 GPU</button><button id="retry-gpu">重试 GPU</button>
    <canvas id="scene" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <canvas id="gpu-scene" width="320" height="100" hidden></canvas>
    <output id="gpu-status">WebGPU 探测中…</output>
    <script type="module" src="./instance-sources.mjs"></script>
  </body>
</html>
