<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quamolit Motion 标量与二维向量采样验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { display: block; border: 1px solid #94a3b8; margin: 16px 0; }
      button { margin-right: 8px; padding: 6px 10px; }
      input { width: 280px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <nav aria-label="演示导航" style="position:fixed;top:10px;right:12px;z-index:1000;background:#fff;border:1px solid #b8cbd5;border-radius:7px;padding:6px 12px;font:14px system-ui"><a href="../demos/index.html" style="color:#175b73">← 所有演示</a></nav>
    <h1>Motion 标量与二维向量采样</h1>
    <p>由 Calcit 标量与二维向量描述生成中间帧。时间可跳转、倒退和重复，不运行自动时钟。</p>
    <div id="controls"></div>
    <label>时间 <input id="time" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
    <canvas id="frame" width="280" height="160"></canvas>
    <output id="status">加载中…</output>
    <script type="module" src="./motion.mjs"></script>
  </body>
</html>
