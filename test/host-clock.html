<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quamolit 宿主时间映射验证</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; color: #172033; }
      canvas { display: block; border: 1px solid #94a3b8; margin: 16px 0; }
      button { margin: 0 8px 8px 0; padding: 6px 10px; }
      #status[data-result="pass"] { color: #166534; }
      #status[data-result="fail"] { color: #b91c1c; }
    </style>
  </head>
  <body>
    <nav aria-label="演示导航" style="position:fixed;top:10px;right:12px;z-index:1000;background:#fff;border:1px solid #b8cbd5;border-radius:7px;padding:6px 12px;font:14px system-ui"><a href="../demos/index.html" style="color:#175b73">← 所有演示</a></nav>
    <h1>显式宿主时间映射</h1>
    <p>按钮依次演示暂停、恢复、变速、倒放和 seek。Canvas 只绘制 Calcit 在映射后的动画时间直接采样的中间帧。</p>
    <div id="actions"></div>
    <canvas id="host-clock" width="320" height="100"></canvas>
    <output id="status">加载中…</output>
    <script type="module" src="./host-clock.mjs"></script>
  </body>
</html>
